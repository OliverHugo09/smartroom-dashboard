services:
  mosquitto:
    build:
      context: ./services/mosquitto
      dockerfile: Dockerfile
    container_name: smartroom-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -u smartroom -P smartroom -t smartroom/healthcheck -m ok > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  simulator:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    container_name: smartroom-simulator
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USER=${MQTT_USER:-smartroom}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-smartroom}
      - SIMULATOR_ENABLED=true
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: smartroom-nodered
    ports:
      - "1880:1880"
    environment:
      - PORT=1880
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USER=${MQTT_USER:-smartroom}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-smartroom}
      - PROPERTY_ID=demo-hotel
      - SIMULATOR_ENABLED=false
      - NODERED_EDITOR_ENABLED=false
      - NODERED_CREDENTIAL_SECRET=${NODERED_CREDENTIAL_SECRET:-cambiar_en_produccion}
      - DEMO_KEY=${DEMO_KEY:-demo-local-key}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - VACANT_MINUTES=2
      - RATE_LIMIT_PER_MIN=60
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
